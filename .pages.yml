media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: date
        label: Date
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - সাহিত্য
            - কথাসাহিত্য
            - বিজ্ঞান
            - দর্শন
            - ভ্রমণ
      - name: badge
        label: Badge
        type: string
      - name: readTime
        label: Read Time
        type: string
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: excerpt
        label: Excerpt
        type: text
      - name: body
        label: Body
        type: rich-text